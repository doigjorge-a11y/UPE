<script>
        // RECIBE LOS DATOS DIRECTAMENTE DEL SERVIDOR DE GOOGLE
        const BD_GLOBAL_TRAZABILIDAD = <?!= JSON.stringify(datosConsolidados) ?>;

        function cambiarPestaña(pestana) {
            const btnTra = document.getElementById('btn-tab-trazabilidad');
            const btnDas = document.getElementById('btn-tab-dashboard');
            const secTra = document.getElementById('vista-trazabilidad');
            const secDas = document.getElementById('vista-dashboard');

            if (pestana === 'trazabilidad') {
                btnTra.className = "py-4 px-1 border-b-2 font-medium text-sm border-emerald-600 text-emerald-600 flex items-center space-x-2 transition";
                btnDas.className = "py-4 px-1 border-b-2 font-medium text-sm border-transparent text-slate-500 hover:text-slate-700 flex items-center space-x-2 transition";
                secTra.classList.remove('hidden');
                secDas.classList.add('hidden');
            } else {
                btnDas.className = "py-4 px-1 border-b-2 font-medium text-sm border-emerald-600 text-emerald-600 flex items-center space-x-2 transition";
                btnTra.className = "py-4 px-1 border-b-2 font-medium text-sm border-transparent text-slate-500 hover:text-slate-700 flex items-center space-x-2 transition";
                secDas.classList.remove('hidden');
                secTra.classList.add('hidden');
            }
        }

        function realizarBusquedaTrazabilidad() {
            const criterio = document.getElementById('input-criterio').value.trim().toUpperCase();
            if (!criterio) {
                alert("Ingrese un criterio de búsqueda (Nombre, DNI, Expediente u Hoja de Ruta).");
                return;
            }

            // Búsqueda transversal por Administrado, DNI, Expediente o Hoja de Trámite
            const encontrado = BD_GLOBAL_TRAZABILIDAD.find(item => {
                return item.administrado.toUpperCase().includes(criterio) || 
                       item.dni.toUpperCase().includes(criterio) || 
                       item.expediente.toUpperCase().includes(criterio) || 
                       item.ht.toUpperCase().includes(criterio);
            });

            if (!encontrado) {
                alert("No se encontró ningún registro con ese criterio.");
                return;
            }

            // Cabecera de la Tarjeta
            document.getElementById('card-administrado').innerText = encontrado.administrado;
            document.getElementById('card-dni').innerText = encontrado.dni;
            document.getElementById('card-exp').innerText = encontrado.expediente;
            document.getElementById('card-ht').innerText = encontrado.ht;

            // Módulo Legal
            document.getElementById('badge-legal').innerText = encontrado.legal.estado;
            document.getElementById('resp-legal').innerText = encontrado.legal.resp;
            document.getElementById('det-legal').innerText = encontrado.legal.det;
            document.getElementById('obs-legal').innerText = encontrado.legal.obs;

            // Módulo Psicología
            document.getElementById('badge-psico').innerText = encontrado.psico.estado;
            document.getElementById('resp-psico').innerText = encontrado.psico.resp;
            document.getElementById('det-psico').innerText = encontrado.psico.det;
            document.getElementById('obs-psico').innerText = encontrado.psico.obs;

            // Módulo Trabajo Social
            document.getElementById('badge-social').innerText = encontrado.social.estado;
            document.getElementById('resp-social').innerText = encontrado.social.resp;
            document.getElementById('det-social').innerText = encontrado.social.det;
            document.getElementById('obs-social').innerText = encontrado.social.obs;
        }
    </script>

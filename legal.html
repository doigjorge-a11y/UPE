<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Legal - Registro Multidisciplinario</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-950 border-b border-slate-800 p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider text-blue-400">MÓDULO LEGAL - REGISTRO DE EXPEDIENTES</h1>
        <span class="text-xs bg-blue-900 text-blue-200 px-3 py-1 rounded-full font-semibold">SISTEMA UNIFICADO</span>
    </header>

    <!-- Main Container -->
    <main class="flex-grow container mx-auto p-6 max-w-4xl">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-8 shadow-2xl">
            <h2 class="text-lg font-semibold text-white mb-6 border-b border-slate-700 pb-3">Formulario de Registro de Ingreso</h2>

            <form id="formRegistroLegal" class="space-y-6">
                
                <!-- Oculto para identificar la hoja de destino -->
                <input type="hidden" id="hojaDestino" value="BD_LEGAL">

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Código / ID -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Código de Registro</label>
                        <input type="text" id="codigo" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="LEG-000X">
                    </div>
                    <!-- Turno -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Turno / Equipo</label>
                        <select id="turno" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="MAÑANA - EQUIPO 1">Mañana - Equipo 1</option>
                            <option value="TARDE - EQUIPO 1">Tarde - Equipo 1</option>
                        </select>
                    </div>
                    <!-- Especialista -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Especialista Responsable</label>
                        <input type="text" id="especialista" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nombre del especialista">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Fecha Registro -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Fecha de Registro</label>
                        <input type="date" id="fechaRegistro" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <!-- Hoja de Trámite -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Hoja de Trámite (HT)</label>
                        <input type="text" id="hojaTramite" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="N° Hoja Trámite">
                    </div>
                    <!-- Expediente -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Expediente</label>
                        <input type="text" id="expediente" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ej: 852-2026">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Apellidos -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Apellidos Completos</label>
                        <input type="text" id="apellidos" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Apellidos del administrado">
                    </div>
                    <!-- Nombres -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Nombres Completos</label>
                        <input type="text" id="nombres" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nombres del administrado">
                    </div>
                    <!-- DNI -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">DNI</label>
                        <input type="text" id="dni" maxlength="8" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="8 dígitos">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <!-- Sexo -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Sexo</label>
                        <select id="sexo" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="MASCULINO">Masculino</option>
                            <option value="FEMENINO">Femenino</option>
                        </select>
                    </div>
                    <!-- Fecha Nacimiento -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Fecha de Nacimiento</label>
                        <input type="date" id="fechaNacimiento" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <!-- Edad -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Edad</label>
                        <input type="number" id="edad" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0">
                    </div>
                    <!-- Distrito -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Distrito</label>
                        <input type="text" id="distrito" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Distrito">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Estado -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Estado Jurídico</label>
                        <input type="text" id="estado" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Estado del caso">
                    </div>
                    <!-- Tipo -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Tipo de Asesoría</label>
                        <input type="text" id="tipo" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Tipo / Modalidad">
                    </div>
                    <!-- Observaciones -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Observaciones / Acciones</label>
                        <input type="text" id="observaciones" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Detalles u observaciones">
                    </div>
                </div>

                <!-- Botón de Envío -->
                <div class="pt-4 flex justify-end">
                    <button type="submit" id="btnEnviar" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-8 py-3 rounded-lg shadow-lg transition duration-200 flex items-center gap-2">
                        <span>Guardar Registro</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Script de Envío Directo (Frontend -> Google Apps Script) -->
    <script>
        // PEGA AQUÍ LA URL DE TU WEB APP DE GOOGLE APPS SCRIPT
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzw5T4iLUETG1VQK_h2hKZVlaqO9T7u3Uc2MJTqVbp00do0lurg4Dg4R-DbogfQIzXfqA/exec";

        document.getElementById('formRegistroLegal').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('btnEnviar');
            btn.disabled = true;
            btn.innerText = "Enviando...";

            // Empaquetado completo de los campos del formulario
            const payload = {
                hojaDestino: document.getElementById('hojaDestino').value,
                codigo: document.getElementById('codigo').value,
                turno: document.getElementById('turno').value,
                especialista: document.getElementById('especialista').value,
                fechaRegistro: document.getElementById('fechaRegistro').value,
                hojaTramite: document.getElementById('hojaTramite').value,
                expediente: document.getElementById('expediente').value,
                apellidos: document.getElementById('apellidos').value,
                nombres: document.getElementById('nombres').value,
                dni: document.getElementById('dni').value,
                sexo: document.getElementById('sexo').value,
                fechaNacimiento: document.getElementById('fechaNacimiento').value,
                edad: document.getElementById('edad').value,
                distrito: document.getElementById('distrito').value,
                estado: document.getElementById('estado').value,
                tipo: document.getElementById('tipo').value,
                observaciones: document.getElementById('observaciones').value
            };

            try {
                // Envío mediante fetch POST hacia el Apps Script
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Evita bloqueos CORS de Google
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                alert('¡Registro enviado correctamente!');
                document.getElementById('formRegistroLegal').reset();
            } catch (error) {
                console.error("Error al enviar:", error);
                alert('Hubo un error al conectar con el servidor.');
            } finally {
                btn.disabled = false;
                btn.innerText = "Guardar Registro";
            }
        });
    </script>
</body>
</html>
